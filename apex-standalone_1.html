  .login-card{

  .pbar.dark{background:rgba(237,232,216,.12);}

  .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; color:var(--maroon); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; padding:0 8px 8px; font-weight:700;}

  .gpa-hero{display:flex; align-items:baseline; gap:10px;}
  .gpa-num{font-family:'Fraunces'; font-size:42px; font-weight:600; color:var(--maroon); line-height:1;}
  .gpa-scale{color:var(--ink-dim); font-size:12.5px;}

  .grade-card h3{margin:0 0 2px; color:var(--ink); font-size:16px;}
  .milestone{display:flex; align-items:center; gap:10px; font-size:13.5px; padding:4px 0;}

  .timer-display{font-family:'JetBrains Mono'; font-size:48px; text-align:center; padding:16px 0 6px; letter-spacing:1px; color:var(--maroon);}
  .timer-controls{display:flex; gap:10px; justify-content:center; margin-bottom:6px;}

  .heatmap{display:grid; grid-template-columns:repeat(auto-fill, 14px); gap:4px;}
  .heatcell{width:14px; height:14px; border-radius:3px; background:rgba(36,50,72,.08); border:1px solid rgba(36,50,72,.14);}

  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--chalk-rail); border:1px solid var(--gold); color:var(--chalk-text); padding:10px 18px; border-radius:99px; font-size:13px; z-index:100; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .flex-between{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .muted{color:var(--ink-dim); font-size:12.5px;}
  .row-gap{display:flex; gap:8px; flex-wrap:wrap;}
  label.field{display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--chalk-dim);}

  .stat-tile{background:var(--chalk-rail); border:1px solid var(--chalk-line); border-radius:10px; padding:16px 18px;}
  .stat-tile .num{font-family:'Fraunces'; font-size:30px; color:var(--gold); line-height:1;}
  .stat-tile .lbl{font-size:11.5px; color:var(--chalk-dim); margin-top:4px;}

  .overview-grade{background:var(--chalk-rail); border:1px solid var(--chalk-line); border-radius:10px; padding:16px 18px;}
  .overview-grade h3{margin:0 0 6px; font-size:15px; color:var(--chalk-text); font-family:'Fraunces',serif;}
  .overview-grade .pct{font-family:'JetBrains Mono'; color:var(--gold); font-size:13px;}
  .overview-next{margin-top:10px; font-size:12px; color:var(--chalk-dim);}
  .overview-next div{padding:2px 0;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
</style>
</head>

<script>
/* ============ ICONS ============ */
const ICONS = {

/* ============ RESILIENT STORAGE (falls back to in-memory if the storage API is unavailable) ============ */
const memoryStore = {};
function hasRealStorage(){ return typeof window.storage === 'object' && window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function'; }

async function safeStorageGet(key, shared){
  if(hasRealStorage()){
    try{ return await window.storage.get(key, shared); }

    const raw = localStorage.getItem(key);

    for(let attempt=0; attempt<2; attempt++){
      try{ return await window.storage.set(key, value, shared); }
      catch(e){ if(attempt===1) break; }
    }
  }
  if(hasLocalStorage()){
    try{ localStorage.setItem(key, value); return { key, value, shared }; }
    catch(e){ return null; }
  }
  return { key, value, shared };
}

async function loadDirectory(){
  try{
    const res = await safeStorageGet(DIR_KEY, false);
    directory = res && res.value ? JSON.parse(res.value) : { profiles:{} };
  }catch(e){
    directory = { profiles:{} };
  }
  if(!directory.profiles) directory.profiles = {};
}
function queueSaveDirectory(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const result = await safeStorageSet(DIR_KEY, JSON.stringify(directory), false);
    if(result === null){ showToast('Saved for now — this device could not confirm long-term storage.'); }
  }, 350);
}
function queueSave(){
  if(currentUsername && directory && directory.profiles[currentUsername]){
    directory.profiles[currentUsername].data = state;
  }
  queueSaveDirectory();
}

/* ============ HELPERS ============ */
function uid(){ return Math.random().toString(36).slice(2,10); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'}); }
function fmtDateShort(d){ const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString(undefined,{month:'short', day:'numeric'}); }
function addDays(dateStr, n){ const dt = new Date(dateStr+'T00:00:00'); dt.setDate(dt.getDate()+n); return dt.toISOString().slice(0,10); }
function weekDates(anchor){ const dt=new Date(anchor+'T00:00:00'); const dow=(dt.getDay()+6)%7; const monday=addDays(anchor,-dow); return Array.from({length:7},(_,i)=>addDays(monday,i)); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('show'),2200); }
function escapeHTML(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

function seedTodayFromRecurring(){
  const t = todayStr();
  if(!state.tasksByDate[t]){
    state.tasksByDate[t] = state.recurringTasks.map(r=>({id:uid(), text:r.text, done:false}));
  }
}
function dayCompletion(dateStr){
  const tasks = state.tasksByDate[dateStr] || [];
  const minutes = state.focusByDate[dateStr] || 0;
  if(tasks.length === 0){ if(minutes<=0) return 0; return Math.min(1, minutes/30); }
  const done = tasks.filter(t=>t.done).length;
  let pct = done/tasks.length;
  if(minutes>0) pct = Math.min(1, pct + Math.min(0.15, minutes/200));
  return pct;
}
function dayCountsForStreak(dateStr){
  const tasks = state.tasksByDate[dateStr] || [];
  const minutes = state.focusByDate[dateStr] || 0;
  return tasks.some(t=>t.done) || minutes>=15;
}
function computeStreak(){
  let cur=0, cursor=todayStr();
  while(dayCountsForStreak(cursor)){ cur++; cursor=addDays(cursor,-1); }
  state.streak.current = cur;
  if(cur > (state.streak.longest||0)) state.streak.longest = cur;
}

/* ============ GRADE / GPA ============ */
const LETTER_POINTS = {'A+':4.0,'A':4.0,'A-':3.7,'B+':3.3,'B':3.0,'B-':2.7,'C+':2.3,'C':2.0,'C-':1.7,'D+':1.3,'D':1.0,'D-':0.7,'F':0.0};
function percentToBase(p){ if(p>=93) return 4.0; if(p>=90) return 3.7; if(p>=87) return 3.3; if(p>=83) return 3.0; if(p>=80) return 2.7; if(p>=77) return 2.3; if(p>=73) return 2.0; if(p>=70) return 1.7; if(p>=67) return 1.3; if(p>=65) return 1.0; return 0.0; }
function coursePoints(course){
  let base;
  if(course.mode === 'percent'){ base = state.profile.scale === '100' ? null : percentToBase(Number(course.value)||0); }
  else { base = LETTER_POINTS[course.value] ?? 0; }
  if(state.profile.scale === '5.0' && base !== null){
    if(course.level === 'honors') base = Math.min(5, base + 0.5);
    if(course.level === 'ap') base = Math.min(5, base + 1.0);
  }
  return base;
}
function letterToPercentApprox(letter){ const map={'A+':98,'A':95,'A-':91,'B+':88,'B':85,'B-':81,'C+':78,'C':75,'C-':71,'D+':68,'D':65,'D-':62,'F':50}; return map[letter] ?? 75; }
function computeGPA(){
  const scale = state.profile.scale;
  const courses = state.courses;
  if(courses.length===0) return null;
  if(scale === '100'){
    let totalW=0, totalC=0;
    courses.forEach(c=>{ const pct = c.mode==='percent' ? Number(c.value)||0 : letterToPercentApprox(c.value); const credits=Number(c.credits)||1; totalW+=pct*credits; totalC+=credits; });
    return totalC ? (totalW/totalC) : null;
  }
  let totalW=0, totalC=0;
  courses.forEach(c=>{ const pts=coursePoints(c); const credits=Number(c.credits)||1; if(pts===null) return; totalW+=pts*credits; totalC+=credits; });
  return totalC ? (totalW/totalC) : null;
}
function gpaDisplay(){ const g=computeGPA(); if(g===null) return '—'; return state.profile.scale==='100' ? g.toFixed(1)+'%' : g.toFixed(2); }
function recordGpaSnapshot(){
  const g = computeGPA();
  if(g === null) return;
  const t = todayStr();
  if(state.gpaHistory[t] !== g){
    state.gpaHistory[t] = g;
    queueSave();
  }
}

function signIn(username){
  currentUsername = username;
  state = directory.profiles[username].data;
  if(!state.gradeGoals) migrateState();
  if(!state.gpaHistory) state.gpaHistory = {};
  seedTodayFromRecurring();
  recordGpaSnapshot();
  directory.lastActiveUsername = username;
  queueSaveDirectory();
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').classList.add('show');
  activeTab = 'overview';
  renderNav();
  renderMain();
  showToast(`Signed in as ${username}`);
}
function migrateState(){
  const gradeGoals = {};
  ['9','10','11','12'].forEach(g=>{ gradeGoals[g] = { required: STANDARD_GOALS[g].map(text=>({id:uid(),text,done:false})), custom:[] }; });
  gradeGoals.general = { required:[], custom: (state.goals||[]).map(g=>({id:g.id||uid(), text:g.title||g.text||'Goal', done: !!(g.milestones && g.milestones.length && g.milestones.every(m=>m.done))})) };
  state.gradeGoals = gradeGoals;
  delete state.goals;
  if(!state.profile.grade) state.profile.grade = '9';
  if(state.profile.email === undefined) state.profile.email = '';
  if(!state.gpaHistory) state.gpaHistory = {};
}

/* ============ OVERVIEW (status dashboard) ============ */
function categoryStats(catKey){
  const cat = state.gradeGoals[catKey];
  const all = [...cat.required, ...cat.custom];
  const done = all.filter(g=>g.done).length;
  const total = all.length;
  const pct = total ? Math.round((done/total)*100) : 0;
  const nextUp = cat.required.filter(g=>!g.done).slice(0,3);
  return {done,total,pct,nextUp};
}
function renderOverview(main){
  computeStreak();
  const cats = ['9','10','11','12'];
  const allStats = cats.map(c=>categoryStats(c));
  const totalDone = allStats.reduce((s,x)=>s+x.done,0);
  const totalAll = allStats.reduce((s,x)=>s+x.total,0);

function renderTaskRows(tasks){
  if(!tasks.length) return `<div class="empty">No tasks yet today — add your first one below.</div>`;
  return tasks.map(t=>`<div class="task-row" data-id="${t.id}">
    <button class="task-check ${t.done?'done':''}" data-action="toggle">${t.done?'✓':''}</button>
    <div class="task-text ${t.done?'done':''}">${escapeHTML(t.text)}</div>
    <button class="task-del" data-action="del">✕</button>
  </div>`).join('');
}
function wireTaskRowEvents(){
  document.querySelectorAll('#task-list .task-row').forEach(row=>{
    const id = row.dataset.id;
    row.querySelector('[data-action=toggle]').addEventListener('click', ()=>{
      const arr = state.tasksByDate[todayStr()]; const item = arr.find(x=>x.id===id); item.done=!item.done;
      queueSave(); renderDashboard(document.getElementById('main'));
    });
    row.querySelector('[data-action=del]').addEventListener('click', ()=>{
      const t = todayStr(); state.tasksByDate[t] = state.tasksByDate[t].filter(x=>x.id!==id);
      queueSave(); renderDashboard(document.getElementById('main'));
    });
  });
}
function addTaskFromInput(){
  const inp = document.getElementById('new-task'); const text = inp.value.trim(); if(!text) return;
  const t = todayStr(); if(!state.tasksByDate[t]) state.tasksByDate[t]=[];
  state.tasksByDate[t].push({id:uid(), text, done:false}); inp.value='';
  queueSave(); renderDashboard(document.getElementById('main'));
}

/* ============ CHART HELPERS ============ */
function lineChartSVG(points, opts){
  opts = opts || {};
  const width = opts.width || 320, height = opts.height || 180;
  const padL = 30, padR = 10, padT = 14, padB = 24;
  const values = points.map(p=>p.value);
  const max = opts.max != null ? opts.max : Math.max(1, ...values);
  const min = opts.min != null ? opts.min : 0;
  const innerW = width - padL - padR, innerH = height - padT - padB;
  const n = points.length;
  const xStep = n > 1 ? innerW / (n - 1) : 0;
  const yFor = v => padT + innerH - ((v - min) / ((max - min) || 1)) * innerH;
  const xFor = i => padL + i * xStep;
  const linePath = points.map((p,i)=> `${i===0?'M':'L'} ${xFor(i).toFixed(1)} ${yFor(p.value).toFixed(1)}`).join(' ');
  const areaPath = `${linePath} L ${xFor(n-1).toFixed(1)} ${(padT+innerH).toFixed(1)} L ${xFor(0).toFixed(1)} ${(padT+innerH).toFixed(1)} Z`;
  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const y = padT + innerH * f;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${width-padR}" y2="${y.toFixed(1)}" stroke="rgba(36,50,72,.08)" stroke-width="1"/>`;
  }).join('');
  const color = opts.color || '#8B2E3C';
  const dots = points.map((p,i)=>`<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(p.value).toFixed(1)}" r="3" fill="${color}"><title>${escapeHTML(p.label)}: ${p.value}${opts.unit||''}</title></circle>`).join('');
  const labelEvery = Math.max(1, Math.ceil(n/5));
  const xLabels = points.map((p,i)=> (i%labelEvery===0 || i===n-1) ? `<text x="${xFor(i).toFixed(1)}" y="${height-7}" font-size="10.5" fill="#5B6B80" text-anchor="middle">${escapeHTML(p.label)}</text>` : '').join('');
  const u = 'lc' + (logoCounter++);
  return `<svg width="100%" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="grad-${u}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity="0.28"/>
      <stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${gridLines}
    <path d="${areaPath}" fill="url(#grad-${u})"/>
    <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    ${xLabels}
  </svg>`;
}
function barChartSVG(points, opts){
  opts = opts || {};
  const width = opts.width || 320, height = opts.height || 180;
  const padL = 30, padR = 10, padT = 14, padB = 24;
  const max = opts.max != null ? opts.max : Math.max(1, ...points.map(p=>p.value));
  const innerW = width - padL - padR, innerH = height - padT - padB;
  const n = points.length;
  const slot = innerW / n;
  const barW = slot * 0.55;
  const color = opts.color || '#D9A63C';
  const bars = points.map((p,i)=>{
    const h = (p.value / max) * innerH;
    const x = padL + i*slot + (slot-barW)/2;
    const y = padT + innerH - h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(h,0.5).toFixed(1)}" rx="3" fill="${color}"><title>${escapeHTML(p.label)}: ${p.value}${opts.unit||''}</title></rect>`;
  }).join('');
  const labelEvery = Math.max(1, Math.ceil(n/5));
  const xLabels = points.map((p,i)=> (i%labelEvery===0 || i===n-1) ? `<text x="${(padL+i*slot+slot/2).toFixed(1)}" y="${height-7}" font-size="10.5" fill="#5B6B80" text-anchor="middle">${escapeHTML(p.label)}</text>` : '').join('');
  const baseline = `<line x1="${padL}" y1="${padT+innerH}" x2="${width-padR}" y2="${padT+innerH}" stroke="rgba(36,50,72,.18)" stroke-width="1"/>`;
  return `<svg width="100%" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">${baseline}${bars}${xLabels}</svg>`;
}
function hBarChartSVG(items, opts){
  opts = opts || {};
  const width = opts.width || 320;
  const rowH = 32;
  const height = items.length * rowH + 10;
  const padL = 94, padR = 32;
  const innerW = width - padL - padR;
  const rows = items.map((it,i)=>{
    const y = 10 + i*rowH;
    const barW = innerW * (it.pct/100);
    const color = it.pct >= 100 ? '#D9A63C' : '#8B2E3C';
    return `
      <text x="${padL-8}" y="${(y+rowH/2+3.5).toFixed(1)}" font-size="11" fill="#243248" text-anchor="end">${escapeHTML(it.label)}</text>
      <rect x="${padL}" y="${(y+6).toFixed(1)}" width="${innerW}" height="13" rx="6.5" fill="rgba(36,50,72,.08)"/>
      <rect x="${padL}" y="${(y+6).toFixed(1)}" width="${Math.max(barW,2).toFixed(1)}" height="13" rx="6.5" fill="${color}"><title>${escapeHTML(it.label)}: ${it.pct}%</title></rect>
      <text x="${(padL+innerW+7).toFixed(1)}" y="${(y+rowH/2+3.5).toFixed(1)}" font-size="10.5" fill="#5B6B80">${it.pct}%</text>
    `;
  }).join('');
  return `<svg width="100%" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">${rows}</svg>`;
}

/* ============ GROWTH DASHBOARD ============ */
function renderGrowthDashboard(main){
  recordGpaSnapshot();
  const anchor = todayStr();
  const nDays = 14;
  const dayList = [];
  for(let i=nDays-1;i>=0;i--) dayList.push(addDays(anchor,-i));

  const completionPoints = dayList.map(d=>({label: fmtDateShort(d), value: Math.round(dayCompletion(d)*100)}));
  const focusPoints = dayList.map(d=>({label: fmtDateShort(d), value: state.focusByDate[d]||0}));

  const gpaDates = Object.keys(state.gpaHistory).sort().slice(-14);
  const gpaMax = state.profile.scale==='100' ? 100 : (state.profile.scale==='5.0' ? 5 : 4);
  const gpaPoints = gpaDates.map(d=>({label: fmtDateShort(d), value: Math.round(state.gpaHistory[d]*100)/100}));

  const roadmapCats = ['9','10','11','12','general'];
  const roadmapItems = roadmapCats.map(c=>{
    const s = categoryStats(c);
    return { label: GRADE_LABELS[c].split(' · ')[0], pct: s.pct };
  });

  const hasCompletion = completionPoints.some(p=>p.value>0);
  const hasFocus = focusPoints.some(p=>p.value>0);

  main.innerHTML = `
    <div class="topbar"><div><h1>Growth Dashboard</h1><div class="sub">Your progress across every area, tracked over time — not just today.</div></div></div>

    <div class="card">
      <div class="section-title">Daily task completion — last 14 days</div>
      ${hasCompletion ? lineChartSVG(completionPoints, {color:'#8B2E3C', unit:'%', max:100}) : `<div class="empty">Complete a few tasks on Today to start seeing this trend.</div>`}
    </div>

    <div class="card">
      <div class="section-title">Focus minutes — last 14 days</div>
      ${hasFocus ? barChartSVG(focusPoints, {color:'#D9A63C', unit:' min'}) : `<div class="empty">Log a Focus Timer session to start seeing this chart.</div>`}
    </div>

    <div class="card">
      <div class="section-title">GPA trend</div>
      ${gpaPoints.length>1 ? lineChartSVG(gpaPoints, {color:'#5F8F62', max:gpaMax}) : `<div class="empty">Add or edit courses across a few different days to build a GPA trend.</div>`}

    <div class="card">
      <div class="section-title">Grade roadmap progress by category</div>
      ${hBarChartSVG(roadmapItems)}

/* ============ GRADE ROADMAP (4-year goals) ============ */
function renderRoadmap(main){
  const order = ['9','10','11','12','general'];
  main.innerHTML = `
    <div class="topbar"><div><h1>Grade Roadmap</h1><div class="sub">Standard college-prep goals for every year, plus anything custom you want to track.</div></div></div>
    <div id="roadmap-cats">${order.map(roadmapCategoryCard).join('')}</div>
  `;

}
function roadmapCategoryCard(catKey){
  const cat = state.gradeGoals[catKey];
  const all = [...cat.required, ...cat.custom];
  const done = all.filter(g=>g.done).length;
  const pct = all.length ? Math.round((done/all.length)*100) : 0;
  return `<div class="card grade-card" data-cat="${catKey}">
    <div class="flex-between"><h3>${GRADE_LABELS[catKey]}</h3><div class="muted">${done}/${all.length} complete</div></div>
    <div class="pbar" style="margin:8px 0 12px;"><div style="width:${pct}%"></div></div>
    <div class="goal-rows">
      ${cat.required.map(g=>goalRow(g,true)).join('')}
      ${cat.custom.map(g=>goalRow(g,false)).join('')}
      ${!cat.required.length && !cat.custom.length ? `<div class="empty">No goals yet — add a custom one below.</div>` : ''}
    </div>
    <div class="addrow">
      <input type="text" class="grow custom-goal-input" placeholder="Add your own goal for this year" />
      <input type="date" class="custom-goal-date" title="Optional deadline" />
      <button class="btn sm" data-action="add-custom">Add</button>
    </div>
  </div>`;
}
function goalRow(g, required){
  const overdue = g.deadline && !g.done && g.deadline < todayStr();
  return `<div class="task-row" data-gid="${g.id}">
    <button class="task-check ${g.done?'done':''}" data-action="toggle-g">${g.done?'✓':''}</button>
    <div style="flex:1;">
      <div class="task-text ${g.done?'done':''}">${escapeHTML(g.text)}</div>
      ${g.deadline ? `<div class="muted" style="font-size:11px; ${overdue?'color:var(--paper-margin); font-weight:600;':''}">${overdue?'⚠ overdue — was due ':'due '}${fmtDate(g.deadline)}</div>` : ''}
    </div>
    ${overdue ? `<span class="tag-required" style="background:var(--paper-margin);">Overdue</span>` : ''}
    ${required ? `<span class="tag-required">Required</span>` : `<button class="task-del" data-action="del-g">✕</button>`}
  </div>`;
}
function wireRoadmapEvents(main){
  document.querySelectorAll('#roadmap-cats .card[data-cat]').forEach(card=>{
    const catKey = card.dataset.cat;
    const cat = state.gradeGoals[catKey];
    card.querySelectorAll('[data-action=toggle-g]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const gid = btn.closest('.task-row').dataset.gid;
        const g = [...cat.required, ...cat.custom].find(x=>x.id===gid);
        g.done = !g.done;
        queueSave(); renderRoadmap(main);
      });
    });
    card.querySelectorAll('[data-action=del-g]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const gid = btn.closest('.task-row').dataset.gid;
        cat.custom = cat.custom.filter(x=>x.id!==gid);
        queueSave(); renderRoadmap(main);
      });
    });
    const addBtn = card.querySelector('[data-action=add-custom]');
    const input = card.querySelector('.custom-goal-input');
    const dateInput = card.querySelector('.custom-goal-date');
    const submit = ()=>{
      const text = input.value.trim(); if(!text) return;
      cat.custom.push({id:uid(), text, done:false, deadline: dateInput.value || null});
      queueSave(); renderRoadmap(main);
    };
    addBtn.addEventListener('click', submit);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  });
}

/* ============ FOCUS TIMER ============ */
let timerSeconds=0, timerRunning=false, timerInterval=null;
function renderFocus(main){
  const t = todayStr(); const todayMin = state.focusByDate[t]||0;
  main.innerHTML = `
    <div class="topbar"><div><h1>Focus Timer</h1><div class="sub">Run a study session — minutes are logged to today and count toward your streak.</div></div></div>
    <div class="card" style="max-width:420px; margin:0 auto;">
      <div class="timer-display mono" id="timer-display">${fmtTimer(timerSeconds)}</div>
      <div class="timer-controls">
        <button class="btn" id="timer-start">${timerRunning?'Pause':'Start'}</button>
        <button class="btn ghost" id="timer-reset">Reset</button>
        <button class="btn ghost" id="timer-save">Log &amp; save</button>
      </div>
      <div class="muted" style="text-align:center;">Logged today: <b class="mono">${todayMin} min</b></div>
    </div>
  `;
  document.getElementById('timer-start').addEventListener('click', ()=>{
    timerRunning=!timerRunning;
    if(timerRunning){ timerInterval=setInterval(()=>{ timerSeconds++; document.getElementById('timer-display').textContent=fmtTimer(timerSeconds); },1000); }
    else clearInterval(timerInterval);
    renderFocus(main);
  });
  document.getElementById('timer-reset').addEventListener('click', ()=>{ clearInterval(timerInterval); timerRunning=false; timerSeconds=0; renderFocus(main); });
  document.getElementById('timer-save').addEventListener('click', ()=>{
    const mins = Math.round(timerSeconds/60);
    if(mins<=0){ showToast('Run the timer a bit before logging.'); return; }
    state.focusByDate[t] = (state.focusByDate[t]||0)+mins;
    clearInterval(timerInterval); timerRunning=false; timerSeconds=0;
    queueSave(); showToast(`Logged ${mins} minute${mins===1?'':'s'} of focus.`);
    renderFocus(main);
  });
}
function fmtTimer(s){ const h=String(Math.floor(s/3600)).padStart(2,'0'); const m=String(Math.floor((s%3600)/60)).padStart(2,'0'); const sec=String(s%60).padStart(2,'0'); return `${h}:${m}:${sec}`; }

/* ============ SETTINGS ============ */
function renderSettings(main){
  main.innerHTML = `
    <div class="topbar"><div><h1>Settings</h1><div class="sub">Make Apex fit exactly how you track things.</div></div></div>

    <div class="card">
      <div class="section-title">My Profile</div>
      <div class="grid2">
        <label class="field">Display name
          <input type="text" id="p-name" value="${escapeHTML(currentUsername)}" />
        </label>
        <label class="field">Grade
          <select id="p-grade">
            <option value="9" ${state.profile.grade==='9'?'selected':''}>9th Grade — Freshman</option>
            <option value="10" ${state.profile.grade==='10'?'selected':''}>10th Grade — Sophomore</option>
            <option value="11" ${state.profile.grade==='11'?'selected':''}>11th Grade — Junior</option>
            <option value="12" ${state.profile.grade==='12'?'selected':''}>12th Grade — Senior</option>
          </select>
        </label>
      </div>

      <label class="field" style="max-width:400px; margin-top:14px;">Email address
        <input type="email" id="p-email" value="${escapeHTML(state.profile.email||'')}" placeholder="you@example.com" />
      </label>
      <div class="muted" style="margin:6px 0 16px;">Used for reminders if a goal misses its deadline, and to send a password reset link if you ever forget your password. Apex runs entirely in your browser and can't send real emails yet, so goal-deadline reminders show as an in-app alert on Overview and Today for now.</div>

      <div class="muted">Password</div>
      <div class="row-gap" style="margin-top:6px;">
        <button class="btn ghost sm" id="p-pw-reset-toggle" type="button">Change password</button>
      </div>
      <div id="pw-change-slot"></div>

      <div class="row-gap" style="margin-top:22px; padding-top:16px; border-top:1px dashed rgba(36,50,72,.2);">
        <button class="btn gold" id="p-save-btn">Save changes</button>
        <button class="btn ghost" id="settings-signout-btn">Sign out</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Grading scale</div>
      <select id="s-scale" style="min-width:220px;">
        <option value="4.0" ${state.profile.scale==='4.0'?'selected':''}>Standard 4.0 (unweighted)</option>
        <option value="5.0" ${state.profile.scale==='5.0'?'selected':''}>Weighted 5.0 (Honors/AP boosts)</option>
        <option value="100" ${state.profile.scale==='100'?'selected':''}>Percent (0–100 average)</option>
      </select>
      <div class="muted" style="margin-top:8px;">Changing scale re-evaluates your existing courses.</div>
    </div>
    <div class="card">
      <div class="section-title">Recurring daily tasks</div>
      <div class="muted" style="margin-bottom:8px;">These auto-populate onto each new day's task list.</div>
      <div id="recurring-list">${state.recurringTasks.length? state.recurringTasks.map(r=>`
        <div class="task-row" data-id="${r.id}"><div class="task-text">${escapeHTML(r.text)}</div><button class="task-del" data-action="del-recurring">✕</button></div>`).join('') : `<div class="empty">No recurring tasks set.</div>`}</div>
      <div class="addrow"><input type="text" id="new-recurring" class="grow" placeholder="e.g. Read for 20 minutes"/><button class="btn" id="add-recurring-btn">Add</button></div>
    </div>
    <div class="card">
      <div class="section-title">Data</div>
      <div class="row-gap">
        <button class="btn ghost" id="export-btn">Export my data (.json)</button>
        <button class="btn danger" id="reset-btn">Reset my data</button>
        <button class="btn danger" id="delete-profile-btn">Delete my profile</button>
      </div>
    </div>
  `;

  const pwSlot = document.getElementById('pw-change-slot');
  document.getElementById('p-pw-reset-toggle').addEventListener('click', ()=>{
    renderPasswordChangeFields(pwSlot);
  });

  document.getElementById('p-save-btn').addEventListener('click', ()=>{
    const newName = document.getElementById('p-name').value.trim();
    const newGrade = document.getElementById('p-grade').value;
    const newEmail = document.getElementById('p-email').value.trim();
    const curPwEl = document.getElementById('p-pw-current');
    const newPwEl = document.getElementById('p-pw-new');
    const confirmPwEl = document.getElementById('p-pw-confirm');
    const curPw = curPwEl ? curPwEl.value : '';
    const newPw = newPwEl ? newPwEl.value : '';
    const confirmPw = confirmPwEl ? confirmPwEl.value : '';

    if(!newName){ showToast('Display name can\'t be empty.'); return; }
    if(!newEmail || !newEmail.includes('@')){ showToast('A valid email address is required.'); return; }
    if(newName !== currentUsername && directory.profiles[newName]){ showToast('That name is already taken on this device.'); return; }
    if(newEmail.toLowerCase() !== (state.profile.email||'').toLowerCase() && findUsernameByEmail(newEmail)){ showToast('That email is already registered to another account.'); return; }

    const wantsPasswordChange = curPwEl !== null;
    if(wantsPasswordChange){
      if(!curPw || curPw !== directory.profiles[currentUsername].password){ showToast('Current password is incorrect.'); return; }
      if(!newPw || newPw.length < 6){ showToast('New password must be at least 6 characters.'); return; }
      if(newPw !== confirmPw){ showToast('New passwords don\'t match.'); return; }
    }

    if(newName !== currentUsername){
      directory.profiles[newName] = directory.profiles[currentUsername];
      delete directory.profiles[currentUsername];
      currentUsername = newName;
      directory.lastActiveUsername = newName;
    }
    const prof = directory.profiles[currentUsername];
    prof.grade = newGrade;
    state.profile.grade = newGrade;
    state.profile.email = newEmail;
    if(wantsPasswordChange) prof.password = newPw;

    queueSave();
    renderNav();
    renderSettings(main);
    showToast('Profile saved.');
  });

  document.getElementById('settings-signout-btn').addEventListener('click', signOut);
  document.getElementById('s-scale').addEventListener('change', e=>{ state.profile.scale=e.target.value; queueSave(); renderSettings(main); showToast('Grading scale updated.'); });
  document.getElementById('add-recurring-btn').addEventListener('click', ()=>{
    const inp=document.getElementById('new-recurring'); const text=inp.value.trim(); if(!text) return;
    state.recurringTasks.push({id:uid(), text}); queueSave(); renderSettings(main);
  });
  document.querySelectorAll('[data-action=del-recurring]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const id=btn.closest('.task-row').dataset.id; state.recurringTasks=state.recurringTasks.filter(x=>x.id!==id); queueSave(); renderSettings(main); });
  });
  document.getElementById('export-btn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='apex-data.json'; a.click(); URL.revokeObjectURL(url);
  });
  document.getElementById('reset-btn').addEventListener('click', ()=>{
    if(!confirm('This clears all your courses, tasks, roadmap progress and logs. Continue?')) return;
    state = freshStudentState(state.profile.grade);
    directory.profiles[currentUsername].data = state;
    seedTodayFromRecurring(); queueSave();
    activeTab='overview'; renderNav(); renderMain(); showToast('Your data was reset.');
  });
  document.getElementById('delete-profile-btn').addEventListener('click', ()=>{
    if(!confirm('This permanently deletes your profile from this device. Continue?')) return;
    delete directory.profiles[currentUsername]; queueSaveDirectory(); signOut();
  });
}
function renderPasswordChangeFields(slot){
  slot.innerHTML = `
    <label class="field" style="margin-top:10px; max-width:340px;">Current password
      <input type="password" id="p-pw-current" placeholder="Your current password" />
    </label>
    <div class="grid2" style="margin-top:10px;">
      <label class="field">New password
        <input type="password" id="p-pw-new" placeholder="At least 6 characters" />
      </label>
      <label class="field">Confirm new password
        <input type="password" id="p-pw-confirm" placeholder="Repeat password" />
      </label>
    </div>
    <div class="row-gap" style="margin-top:8px;">
      <button class="btn ghost sm" id="p-pw-eye" type="button">Show password</button>
      <span class="muted">These fields save when you click "Save changes" below.</span>
    </div>
  `;
  let visible = false;
  document.getElementById('p-pw-eye').addEventListener('click', ()=>{
    visible = !visible;
    const t = visible ? 'text' : 'password';
    document.getElementById('p-pw-current').type = t;
    document.getElementById('p-pw-new').type = t;
    document.getElementById('p-pw-confirm').type = t;
    document.getElementById('p-pw-eye').textContent = visible ? 'Hide password' : 'Show password';
  });
}

/* ============ INIT ============ */
async function init(){
  await loadDirectory();
  loginView = 'signin';
  renderLogin();
}
init();
</script>
</body>
</html>
